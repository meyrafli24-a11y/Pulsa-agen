<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulsaKula - Top Up & Paket Data</title>
<style>
  /* Reset & Base */
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background:#f8f9fc; color:#1e293b; padding-bottom:40px; }
  
  /* Header */
  .header {
    background:#fff; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.02);
    position:sticky; top:0; z-index:100;
  }
  .logo-area { display:flex; align-items:center; gap:6px; }
  .logo-area h1 { font-size:1.4rem; font-weight:800; color:#0ea5e9; letter-spacing:-.5px; }
  .logo-area h1 span { color:#0284c7; }
  .logo-icon { font-size:1.5rem; }
  
  .cart-btn {
    background:#f0f9ff; color:#0284c7; border:none;
    padding:8px 16px; border-radius:12px; font-weight:600; font-size:.9rem;
    display:flex; align-items:center; gap:6px; cursor:pointer;
    transition: .2s;
  }
  .cart-btn:hover { background:#e0f2fe; }

  /* Kategori Pills */
  .categories {
    display:flex; flex-wrap:wrap; gap:10px;
    padding:16px 20px; max-width:1200px; margin:0 auto;
  }
  .categories button {
    padding:8px 16px; border-radius:20px; border:1px solid #e2e8f0;
    background:#fff; color:#64748b; font-size:.85rem; font-weight:500;
    cursor:pointer; transition:.2s; white-space:nowrap;
  }
  .categories button:hover { background:#f1f5f9; }
  .categories button.active { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }

  /* Grid Produk */
  .product-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:16px; padding:0 20px; max-width:1200px; margin:0 auto;
  }

  /* Card Produk */
  .card {
    background:#fff; border-radius:16px; padding:20px;
    box-shadow:0 1px 4px rgba(0,0,0,.04); border:1px solid #f1f5f9;
    display:flex; flex-direction:column; transition:.2s;
  }
  .card:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); }
  
  .card-top { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .icon-box {
    width:44px; height:44px; background:#f0f9ff; border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:1.2rem;
  }
  
  .card h3 { font-size:1rem; font-weight:700; color:#0f172a; margin-bottom:4px; }
  .card .type { font-size:.8rem; color:#94a3b8; margin-bottom:20px; }
  
  .card-bottom { 
    display:flex; justify-content:space-between; align-items:center; margin-top:auto;
  }
  .price { font-size:1.3rem; font-weight:800; color:#16a34a; }
  .btn-pilih {
    background:#e0f2fe; color:#0284c7; border:none;
    padding:8px 18px; border-radius:8px; font-weight:600; font-size:.85rem;
    cursor:pointer; transition:.2s;
  }
  .btn-pilih:hover { background:#bae6fd; }

  /* Note */
  .note { text-align:center; font-size:.8rem; color:#94a3b8; margin:30px 20px; padding:0 20px; }

  /* Banner */
  .banner {
    background:linear-gradient(135deg, #0ea5e9, #2563eb);
    margin:30px 20px; border-radius:16px; padding:24px;
    color:#fff; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
    max-width:1160px; margin-left:auto; margin-right:auto;
  }
  .banner-text h4 { font-size:.8rem; letter-spacing:1px; opacity:.9; margin-bottom:8px; }
  .banner-text h2 { font-size:1.3rem; margin-bottom:6px; }
  .banner-text p { font-size:.85rem; opacity:.9; }

  /* Modal Global */
  .modal-overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:1000;
  }
  .modal-overlay.active { display:flex; }
  .modal-content {
    background:#fff; width:90%; max-width:450px; border-radius:20px; padding:24px;
    max-height:85vh; display:flex; flex-direction:column;
    animation: fadeIn .2s ease-out;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-header h2 { font-size:1.2rem; }
  .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#94a3b8; }
  
  /* Form Input (Modal Input Data) */
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:.85rem; font-weight:600; color:#475569; margin-bottom:6px; }
  .form-group input {
    width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px;
    font-size:.9rem; outline:none; transition:.2s;
  }
  .form-group input:focus { border-color:#0ea5e9; box-shadow:0 0 0 3px rgba(14,165,233,.15); }
  
  .btn-simpan {
    width:100%; background:#0ea5e9; color:#fff; border:none; padding:14px;
    border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer;
    margin-top:10px;
  }
  .btn-simpan:hover { background:#0284c7; }

  /* Keranjang List */
  .cart-list { flex:1; overflow-y:auto; margin-bottom:16px; }
  .cart-item { display:flex; justify-content:space-between; align-items:flex-start; padding:12px 0; border-bottom:1px dashed #e2e8f0; }
  .cart-item-info h4 { font-size:.9rem; color:#1e293b; margin-bottom:2px; }
  .cart-item-info p { font-size:.8rem; color:#16a34a; font-weight:600; }
  .cart-item-info .tujuan { font-size:.75rem; color:#64748b; background:#f1f5f9; padding:2px 6px; border-radius:4px; display:inline-block; margin-top:4px; }
  .btn-hapus { background:#fee2e2; color:#ef4444; border:none; padding:6px 10px; border-radius:6px; font-size:.75rem; cursor:pointer; }
  
  .cart-total { display:flex; justify-content:space-between; font-weight:800; font-size:1.1rem; margin-bottom:16px; padding-top:16px; border-top:2px dashed #e2e8f0; }
  .btn-checkout {
    width:100%; background:#25d366; color:#fff; border:none; padding:14px;
    border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer;
    display:flex; justify-content:center; align-items:center; gap:8px;
  }
  .btn-checkout:hover { background:#1da851; }
  .cart-empty { text-align:center; color:#94a3b8; padding:40px 0; font-size:.9rem; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo-area">
    <span class="logo-icon">⚡</span>
    <h1>PULSA<span>KULA</span></h1>
  </div>
  <button class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
</div>

<!-- Kategori -->
<div class="categories">
  <button class="active">Semua</button>
  <button>Pulsa</button>
  <button>Paket Data</button>
  <button>Token PLN</button>
  <button>E-Wallet</button>
  <button>Voucher Game</button>
</div>

<!-- Produk -->
<div class="product-grid" id="grid"></div>

<p class="note">Harga yang ditampilkan merupakan harga contoh dan dapat berubah setelah konfirmasi admin.</p>

<!-- Banner Bawah -->
<div class="banner">
  <div class="banner-text">
    <h4>PULSAKULA DIGITAL STORE</h4>
    <h2>Belanja digital lebih mudah!</h2>
    <p>Pilih produk favoritmu dan pesan langsung melalui WhatsApp.</p>
  </div>
</div>

<!-- ========================================== -->
<!-- MODAL 1: INPUT NOMOR TUJUAN / ID GAME -->
<!-- ========================================== -->
<div class="modal-overlay" id="inputModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Masukkan Data</h2>
      <button class="close-btn" onclick="closeInputModal()">&times;</button>
    </div>
    <div class="form-group">
      <label id="labelTujuan">Nomor HP</label>
      <input type="number" id="inputTujuan" placeholder="Contoh: 08123456789">
    </div>
    <button class="btn-simpan" onclick="simpanKeKeranjang()">Tambahkan ke Keranjang</button>
  </div>
</div>

<!-- ========================================== -->
<!-- MODAL 2: KERANJANG PESANAN -->
<!-- ========================================== -->
<div class="modal-overlay" id="cartModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Keranjang Pesanan</h2>
      <button class="close-btn" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-total">
      <span>Total:</span>
      <span id="cartTotal" style="color:#16a34a;">Rp 0</span>
    </div>
    <button class="btn-checkout" onclick="checkoutWA()">
      💬 Checkout via WhatsApp
    </button>
  </div>
</div>

<script>
// --- DATA PRODUK ---
const dataPaket = [
  // PULSA (Input: Nomor HP)
  { id: 1, operator:"Telkomsel", nama:"Telkomsel 5.000", harga:6500, tipe:"Pulsa", icon:"📱", labelInput:"Nomor HP Telkomsel", placeholder:"0812xxxx" },
  { id: 2, operator:"Indosat", nama:"Indosat 5.000", harga:6000, tipe:"Pulsa", icon:"📱", labelInput:"Nomor HP Indosat", placeholder:"0857xxxx" },
  { id: 3, operator:"Tri", nama:"Tri 5.000", harga:5500, tipe:"Pulsa", icon:"📱", labelInput:"Nomor HP Tri", placeholder:"0895xxxx" },
  { id: 4, operator:"XL", nama:"XL 5.000", harga:6000, tipe:"Pulsa", icon:"📱", labelInput:"Nomor HP XL", placeholder:"0817xxxx" },
  
  // PAKET DATA (Input: Nomor HP)
  { id: 5, operator:"Telkomsel", nama:"Data Telkomsel 3 GB", harga:25000, tipe:"Paket Data", icon:"🌐", labelInput:"Nomor HP Telkomsel", placeholder:"0812xxxx" },
  { id: 6, operator:"Indosat", nama:"Data Indosat 5 GB", harga:26000, tipe:"Paket Data", icon:"🌐", labelInput:"Nomor HP Indosat", placeholder:"0857xxxx" },
  
  // TOKEN PLN (Input: ID Meteran)
  { id: 7, operator:"PLN", nama:"Token Listrik 20.000", harga:21500, tipe:"Token PLN", icon:"⚡", labelInput:"ID Meteran / Nomor Pelanggan PLN", placeholder:"Contoh: 140xxxxxxx" },
  { id: 8, operator:"PLN", nama:"Token Listrik 50.000", harga:51500, tipe:"Token PLN", icon:"⚡", labelInput:"ID Meteran / Nomor Pelanggan PLN", placeholder:"Contoh: 140xxxxxxx" },

  // E-WALLET (Input: Nomor HP)
  { id: 9, operator:"DANA", nama:"Saldo DANA 10.000", harga:11000, tipe:"E-Wallet", icon:"💳", labelInput:"Nomor HP Terdaftar DANA", placeholder:"08xxxx" },
  { id: 10, operator:"GoPay", nama:"Saldo GoPay 20.000", harga:22000, tipe:"E-Wallet", icon:"💳", labelInput:"Nomor HP Terdaftar GoPay", placeholder:"08xxxx" },

  // VOUCHER GAME (Input: User ID)
  { id: 11, operator:"Mobile Legends", nama:"ML 86 Diamond", harga:23000, tipe:"Voucher Game", icon:"🎮", labelInput:"User ID (Nickname)", placeholder:"Contoh: 12345678 (Nama)" },
  { id: 12, operator:"Free Fire", nama:"FF 70 Diamond", harga:10000, tipe:"Voucher Game", icon:"🎮", labelInput:"User ID Free Fire", placeholder:"Contoh: 987654321" }
];

const NOMOR_WA_ADMIN = "6281234567890"; // <-- GANTI NOMOR WA KAMU DI SINI

let keranjang = [];
let produkSementara = null; // Menyimpan produk yg sedang diinput

const grid = document.getElementById("grid");
const rupiah = n => "Rp " + n.toLocaleString("id-ID");

// --- RENDER PRODUK ---
function render() {
  grid.innerHTML = "";
  dataPaket.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <div class="icon-box">${p.icon}</div>
        <div>
          <h3>${p.nama}</h3>
          <div class="type">${p.tipe}</div>
        </div>
      </div>
      <div class="card-bottom">
        <div class="price">${rupiah(p.harga)}</div>
        <button class="btn-pilih" onclick="bukaInput(${p.id})">Pilih</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// --- LOGIKA INPUT DATA TUJUAN ---
function bukaInput(id) {
  produkSementara = dataPaket.find(p => p.id === id);
  if(!produkSementara) return;

  // Sesuaikan label dan placeholder di form
  document.getElementById("modalTitle").innerText = produkSementara.nama;
  document.getElementById("labelTujuan").innerText = produkSementara.labelInput;
  document.getElementById("inputTujuan").placeholder = produkSementara.placeholder;
  document.getElementById("inputTujuan").value = ""; // Reset input

  document.getElementById("inputModal").classList.add("active");
  document.getElementById("inputTujuan").focus();
}

function closeInputModal() {
  document.getElementById("inputModal").classList.remove("active");
  produkSementara = null;
}

function simpanKeKeranjang() {
  const tujuan = document.getElementById("inputTujuan").value.trim();
  
  if (!tujuan) {
    alert(`Mohon isi ${produkSementara.labelInput} terlebih dahulu!`);
    return;
  }

  // Cek jika produk yang persis sama & nomor tujuan sama sudah ada di keranjang
  const isExist = keranjang.some(item => item.id === produkSementara.id && item.tujuan === tujuan);
  if (isExist) {
    alert("Produk dengan nomor/ID tujuan ini sudah ada di keranjang.");
    closeInputModal();
    return;
  }

  // Masukkan ke keranjang
  keranjang.push({
    ...produkSementara,
    tujuan: tujuan
  });

  closeInputModal();
  updateUI();
  openCart(); // Langsung buka keranjang biar user tahu berhasil
}

// --- LOGIKA KERANJANG ---
function hapusDariKeranjang(index) {
  keranjang.splice(index, 1); // Hapus berdasarkan index array
  updateUI();
  renderCartModal();
}

function updateUI() {
  document.getElementById("cartCount").innerText = keranjang.length;
}

function openCart() {
  renderCartModal();
  document.getElementById("cartModal").classList.add("active");
}

function closeCart() {
  document.getElementById("cartModal").classList.remove("active");
}

function renderCartModal() {
  const list = document.getElementById("cartList");
  const totalEl = document.getElementById("cartTotal");
  
  list.innerHTML = "";
  let total = 0;

  if (keranjang.length === 0) {
    list.innerHTML = `<div class="cart-empty">Keranjang kamu masih kosong nih. Yuk pilih paket dulu!</div>`;
    totalEl.innerText = "Rp 0";
    return;
  }

  keranjang.forEach((item, index) => {
    total += item.harga;
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div class="cart-item-info">
        <h4>${item.nama}</h4>
        <p>${rupiah(item.harga)}</p>
        <span class="tujuan">🎯 ${item.tujuan}</span>
      </div>
      <button class="btn-hapus" onclick="hapusDariKeranjang(${index})">Hapus</button>
    `;
    list.appendChild(div);
  });

  totalEl.innerText = rupiah(total);
}

// --- CHECKOUT WHATSAPP ---
function checkoutWA() {
  if (keranjang.length === 0) {
    alert("Keranjang masih kosong, pilih produk dulu ya!");
    return;
  }

  let pesan = "Halo Admin PulsaKula, saya mau pesan:%0A%0A";
  let total = 0;

  keranjang.forEach((item, index) => {
    pesan += `${index + 1}. *${item.nama}*%0A`;
    pesan += `   Tujuan: ${item.tujuan}%0A`;
    pesan += `   Harga: ${rupiah(item.harga)}%0A%0A`;
    total += item.harga;
  });

  pesan += `*TOTAL BAYAR: ${rupiah(total)}*%0A%0A`;
  pesan += "Mohon info nomor rekening/metode pembayarannya ya. Terima kasih!";

  // Buka WhatsApp
  window.open(`https://wa.me/${NOMOR_WA_ADMIN}?text=${pesan}`, '_blank');
}

// Inisialisasi
render();
</script>

</body>
</html>
