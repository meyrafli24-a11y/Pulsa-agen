<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulsaKula - Paket Data Semua Jaringan</title>
<style>
  /* Reset & Base */
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { background:#f8f9fc; color:#1e293b; padding-bottom:40px; }
  
  /* Header */
  .header {
    background:#fff; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.02);
    position:sticky; top:0; z-index:100;
  }
  .logo-area { display:flex; align-items:center; gap:6px; }
  .logo-area h1 { font-size:1.4rem; font-weight:800; color:#0ea5e9; letter-spacing:-.5px; }
  .logo-area h1 span { color:#0284c7; }
  .logo-icon { font-size:1.5rem; }
  
  .cart-btn {
    background:#f0f9ff; color:#0284c7; border:none;
    padding:8px 16px; border-radius:12px; font-weight:600; font-size:.9rem;
    display:flex; align-items:center; gap:6px; cursor:pointer;
  }

  /* Kategori Pills */
  .categories {
    display:flex; flex-wrap:wrap; gap:10px;
    padding:16px 20px; max-width:1200px; margin:0 auto;
  }
  .categories button {
    padding:8px 16px; border-radius:20px; border:1px solid #e2e8f0;
    background:#fff; color:#64748b; font-size:.85rem; font-weight:500;
    cursor:pointer; transition:.2s; white-space:nowrap;
  }
  .categories button:hover { background:#f1f5f9; }
  .categories button.active { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }

  /* Grid Produk */
  .product-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:16px; padding:0 20px; max-width:1200px; margin:0 auto;
  }

  /* Card Produk */
  .card {
    background:#fff; border-radius:16px; padding:20px;
    box-shadow:0 1px 4px rgba(0,0,0,.04); border:1px solid #f1f5f9;
    display:flex; flex-direction:column; transition:.2s;
  }
  .card:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); }
  
  .card-top { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .icon-box {
    width:44px; height:44px; background:#f0f9ff; border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:1.2rem;
  }
  
  .card h3 { font-size:1rem; font-weight:700; color:#0f172a; margin-bottom:4px; }
  .card .type { font-size:.8rem; color:#94a3b8; margin-bottom:20px; }
  
  .card-bottom { 
    display:flex; justify-content:space-between; align-items:center; margin-top:auto;
  }
  .price { font-size:1.3rem; font-weight:800; color:#16a34a; }
  .btn-pilih {
    background:#e0f2fe; color:#0284c7; border:none;
    padding:8px 18px; border-radius:8px; font-weight:600; font-size:.85rem;
    cursor:pointer; transition:.2s;
  }
  .btn-pilih:hover { background:#bae6fd; }

  /* Footer Note */
  .note {
    text-align:center; font-size:.8rem; color:#94a3b8;
    margin:30px 20px; padding:0 20px;
  }

  /* Banner Bawah (Opsional seperti di gambar) */
  .banner {
    background:linear-gradient(135deg, #0ea5e9, #2563eb);
    margin:30px 20px; border-radius:16px; padding:24px;
    color:#fff; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
    max-width:1160px; margin-left:auto; margin-right:auto;
  }
  .banner-text h4 { font-size:.8rem; letter-spacing:1px; opacity:.9; margin-bottom:8px; }
  .banner-text h2 { font-size:1.3rem; margin-bottom:6px; }
  .banner-text p { font-size:.85rem; opacity:.9; }
  .banner-btn {
    background:#fff; color:#0ea5e9; padding:10px 20px; border-radius:10px;
    font-weight:600; text-decoration:none; font-size:.9rem; white-space:nowrap;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo-area">
    <span class="logo-icon">⚡</span>
    <h1>PULSA<span>KULA</span></h1>
  </div>
  <button class="cart-btn">🛒 <span>0</span></button>
</div>

<!-- Kategori -->
<div class="categories">
  <button class="active">Semua</button>
  <button>Pulsa</button>
  <button>Paket Data</button>
  <button>Masa Aktif</button>
  <button>Token PLN</button>
  <button>E-Wallet</button>
  <button>Voucher Game</button>
  <button>Telepon & SMS</button>
  <button>TV & Hiburan</button>
  <button>Tagihan</button>
  <button>PDAM</button>
  <button>BPJS</button>
  <button>Internet & WiFi</button>
</div>

<!-- Produk (Semua Jaringan) -->
<div class="product-grid" id="grid"></div>

<!-- Note -->
<p class="note">Harga yang ditampilkan merupakan harga contoh dan dapat berubah setelah konfirmasi admin.</p>

<!-- Banner Bawah -->
<div class="banner">
  <div class="banner-text">
    <h4>PULSAKULA DIGITAL STORE</h4>
    <h2>Belanja digital lebih mudah!</h2>
    <p>Pilih produk favoritmu dan pesan langsung melalui admin.</p>
  </div>
  <a href="#" class="banner-btn">Lihat Produk →</a>
</div>

<script>
// Data Paket Data Semua Jaringan
// Termurah 5.000 (harga jual) s/d Termahal
const dataPaket = [
  // 5 Ribuan
  { operator:"Telkomsel", nama:"Telkomsel 5.000", harga:6500, tipe:"Pulsa", icon:"📱" },
  { operator:"Indosat", nama:"Indosat 5.000", harga:6000, tipe:"Pulsa", icon:"📱" },
  { operator:"Tri", nama:"Tri 5.000", harga:5500, tipe:"Pulsa", icon:"📱" },
  { operator:"XL", nama:"XL 5.000", harga:6000, tipe:"Pulsa", icon:"📱" },
  { operator:"Axis", nama:"Axis 5.000", harga:5500, tipe:"Pulsa", icon:"📱" },
  { operator:"Smartfren", nama:"Smartfren 5.000", harga:5500, tipe:"Pulsa", icon:"📱" },
  { operator:"by.U", nama:"by.U 5.000", harga:6000, tipe:"Pulsa", icon:"📱" },

  // 10 Ribuan
  { operator:"Telkomsel", nama:"Telkomsel 10.000", harga:11500, tipe:"Pulsa", icon:"📱" },
  { operator:"Indosat", nama:"Indosat 10.000", harga:11000, tipe:"Pulsa", icon:"📱" },
  { operator:"XL", nama:"XL 10.000", harga:11000, tipe:"Pulsa", icon:"📱" },
  { operator:"Tri", nama:"Tri 10.000", harga:10500, tipe:"Pulsa", icon:"📱" },
  { operator:"Axis", nama:"Axis 10.000", harga:10500, tipe:"Pulsa", icon:"📱" },
  { operator:"Smartfren", nama:"Smartfren 10.000", harga:10500, tipe:"Pulsa", icon:"📱" },
  { operator:"by.U", nama:"by.U 10.000", harga:11000, tipe:"Pulsa", icon:"📱" },

  // 25 Ribuan (Paket Data)
  { operator:"Telkomsel", nama:"Data Telkomsel 3 GB", harga:25000, tipe:"Paket Data", icon:"🌐" },
  { operator:"Indosat", nama:"Data Indosat 5 GB", harga:26000, tipe:"Paket Data", icon:"🌐" },
  { operator:"XL", nama:"Data XL 4 GB", harga:24000, tipe:"Paket Data", icon:"🌐" },
  { operator:"Tri", nama:"Data Tri 6 GB", harga:25000, tipe:"Paket Data", icon:"🌐" },
  { operator:"Axis", nama:"Data Axis 4 GB", harga:23000, tipe:"Paket Data", icon:"🌐" },
  { operator:"Smartfren", nama:"Data Smartfren 5 GB", harga:24000, tipe:"Paket Data", icon:"🌐" },

  // 50 Ribuan
  { operator:"Telkomsel", nama:"Telkomsel 50.000", harga:49500, tipe:"Pulsa", icon:"📱" },
  { operator:"Indosat", nama:"Indosat 50.000", harga:49000, tipe:"Pulsa", icon:"📱" },
  { operator:"XL", nama:"XL 50.000", harga:49000, tipe:"Pulsa", icon:"📱" },
  { operator:"Tri", nama:"Tri 50.000", harga:48500, tipe:"Pulsa", icon:"📱" },

  // 100 Ribuan (Termahal)
  { operator:"Telkomsel", nama:"Data Telkomsel 50 GB", harga:150000, tipe:"Paket Data", icon:"🌐" },
  { operator:"Indosat", nama:"Data Indosat 100 GB", harga:150000, tipe:"Paket Data", icon:"🌐" },
  { operator:"XL", nama:"Data XL 75 GB", harga:145000, tipe:"Paket Data", icon:"🌐" },
  { operator:"Smartfren", nama:"Data Smartfren Unlimited", harga:100000, tipe:"Paket Data", icon:"🌐" }
];

const grid = document.getElementById("grid");
const rupiah = n => "Rp " + n.toLocaleString("id-ID");

function render() {
  grid.innerHTML = "";
  dataPaket.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <div class="icon-box">${p.icon}</div>
        <div>
          <h3>${p.nama}</h3>
          <div class="type">${p.tipe}</div>
        </div>
      </div>
      <div class="card-bottom">
        <div class="price">${rupiah(p.harga)}</div>
        <button class="btn-pilih">Pilih</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// Logic Filter Kategori (Tampilan saja)
document.querySelectorAll(".categories button").forEach(btn => {
  btn.addEventListener("click", (e) => {
    document.querySelectorAll(".categories button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    // Di sini bisa tambahkan logic filter jika kategori diklik
  });
});

render();
</script>

</body>
</html>
