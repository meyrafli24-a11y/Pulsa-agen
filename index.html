<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Kartu Jaringan & Paket Data</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:#e2e8f0;
    padding:24px;
    min-height:100vh;
  }
  h1 { text-align:center; font-size:1.8rem; margin-bottom:6px; }
  .subtitle { text-align:center; color:#94a3b8; margin-bottom:24px; font-size:.9rem; }

  /* Filter */
  .filter-bar {
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:28px;
  }
  .filter-bar button {
    background:#1e293b; color:#cbd5e1; border:1px solid #334155;
    padding:8px 16px; border-radius:20px; cursor:pointer; font-size:.85rem;
    transition:.2s;
  }
  .filter-bar button:hover { background:#334155; }
  .filter-bar button.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }

  /* Grid */
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
    max-width:1200px; margin:0 auto;
  }

  /* Card */
  .card {
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:18px;
    display:flex; flex-direction:column; gap:10px;
    transition:transform .2s, box-shadow .2s;
    position:relative;
    overflow:hidden;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background:var(--accent,#3b82f6);
  }
  .card .operator { font-size:.75rem; text-transform:uppercase; letter-spacing:1px; color:#94a3b8; }
  .card h3 { font-size:1.05rem; color:#f1f5f9; }
  .card .price { font-size:1.5rem; font-weight:700; color:#22c55e; }
  .card .price span { font-size:.8rem; color:#94a3b8; font-weight:400; }
  .card .quota { font-size:.85rem; color:#cbd5e1; }
  .card .desc { font-size:.8rem; color:#94a3b8; line-height:1.4; }
  .tag {
    display:inline-block; font-size:.7rem; padding:3px 8px; border-radius:10px;
    background:#334155; color:#cbd5e1; margin-top:auto; align-self:flex-start;
  }
  .tag.murah { background:#14532d; color:#86efac; }
  .tag.menengah { background:#78350f; color:#fcd34d; }
  .tag.mahal { background:#7f1d1d; color:#fca5a5; }
</style>
</head>
<body>

<h1>📶 Daftar Kartu Jaringan & Paket Data</h1>
<p class="subtitle">Dari 5 ribuan sampai paket besar — sesuai kebutuhan masyarakat</p>

<div class="filter-bar" id="filterBar">
  <button class="active" data-filter="all">Semua</button>
  <button data-filter="murah">💰 5 Ribuan</button>
  <button data-filter="menengah">📱 Menengah</button>
  <button data-filter="mahal">📊 Besar</button>
</div>

<div class="grid" id="grid"></div>

<script>
const paketData = [
  // MURAH (5 ribuan)
  { operator:"Telkomsel", nama:"Paket Serbu / Serba 5 Ribu", harga:5000, kuota:"3 GB / 1 hari", desc:"Cocok untuk internetan darurat seharian dengan budget minim.", kategori:"murah", accent:"#ef4444" },
  { operator:"Tri (3)", nama:"Happy", harga:5650, kuota:"1 GB / 1 hari", desc:"Pilihan murah untuk koneksi darurat harian.", kategori:"murah", accent:"#a855f7" },
  { operator:"Indosat IM3", nama:"IM3 Mini", harga:5000, kuota:"1 GB / 3 hari", desc:"Kombinasi kuota utama dan malam untuk hemat.", kategori:"murah", accent:"#facc15" },

  // MENENGAH (6rb - 25rb)
  { operator:"XL", nama:"HotRod Mini", harga:6200, kuota:"1 GB / 2 hari", desc:"Paket kilat untuk kebutuhan singkat.", kategori:"menengah", accent:"#3b82f6" },
  { operator:"Indosat", nama:"Freedom Mini", harga:10000, kuota:"5 GB / 2 hari", desc:"Kuota besar untuk beberapa hari pemakaian.", kategori:"menengah", accent:"#facc15" },
  { operator:"Axis", nama:"AIGO Bronet Mini", harga:9900, kuota:"2 GB / 3 hari", desc:"Hemat untuk streaming ringan beberapa hari.", kategori:"menengah", accent:"#8b5cf6" },
  { operator:"Telkomsel", nama:"Data Mini", harga:11750, kuota:"1 GB / 7 hari", desc:"Masa aktif seminggu untuk pemakaian ringan.", kategori:"menengah", accent:"#ef4444" },
  { operator:"Smartfren", nama:"Smartfren Mingguan", harga:10700, kuota:"2 GB / 7 hari", desc:"Pilihan mingguan dengan harga terjangkau.", kategori:"menengah", accent:"#ec4899" },
  { operator:"by.U", nama:"by.U Mini", harga:13450, kuota:"2,5 GB / 5 hari", desc:"Fleksibel, cocok untuk anak muda.", kategori:"menengah", accent:"#06b6d4" },

  // BESAR (30rb+)
  { operator:"Indosat", nama:"Freedom Internet", harga:30000, kuota:"15 GB", desc:"Paket menengah untuk kebutuhan bulanan ringan.", kategori:"mahal", accent:"#facc15" },
  { operator:"Smartfren", nama:"5G Unlimited", harga:80000, kuota:"Unlimited mulai 40 GB", desc:"Unlimited untuk pemakaian berat sebulan.", kategori:"mahal", accent:"#ec4899" },
  { operator:"Axis", nama:"5G AF Bronet", harga:100000, kuota:"45 GB / bulan", desc:"Kuota besar untuk kerja & streaming.", kategori:"mahal", accent:"#8b5cf6" },
  { operator:"XL", nama:"Prabayar Ultra 5G+", harga:150000, kuota:"150 GB – 500 GB", desc:"Kuota jumbo untuk kebutuhan sangat tinggi.", kategori:"mahal", accent:"#3b82f6" },
  { operator:"Indosat", nama:"Freedom Jumbo", harga:150000, kuota:"150 GB / 28 hari", desc:"Paket besar untuk pemakaian intensif.", kategori:"mahal", accent:"#facc15" }
];

const grid = document.getElementById("grid");
const filterBar = document.getElementById("filterBar");

function rupiah(n) {
  return "Rp" + n.toLocaleString("id-ID");
}

function render(filter = "all") {
  grid.innerHTML = "";
  const data = filter === "all" ? paketData : paketData.filter(p => p.kategori === filter);
  data.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--accent", p.accent);
    card.innerHTML = `
      <div class="operator">${p.operator}</div>
      <h3>${p.nama}</h3>
      <div class="price">${rupiah(p.harga)} <span>/ paket</span></div>
      <div class="quota">📦 ${p.kuota}</div>
      <div class="desc">${p.desc}</div>
      <span class="tag ${p.kategori}">${
        p.kategori === "murah" ? "Hemat" : p.kategori === "menengah" ? "Menengah" : "Besar"
      }</span>
    `;
    grid.appendChild(card);
  });
}

filterBar.addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#filterBar button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  render(e.target.dataset.filter);
});

render();
</script>

</body>
</html>
